
services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      SQLITE_DB: /app/data/cases.db
      CHROMA_PERSIST_DIR: /app/data/chroma_db
    volumes:
      - ./data:/app/data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8501:8501"
    environment:
      API_BASE_URL: http://api:8000/api
    depends_on:
      - api
