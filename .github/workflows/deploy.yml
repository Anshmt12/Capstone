name: Build & Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:  # allows manual trigger from GitHub UI

env:
  RESOURCE_GROUP: anshmittal
  ACR_NAME: legalcocounselacr
  API_APP_NAME: legal-cocounsel-api
  FRONTEND_APP_NAME: legal-cocounsel-frontend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout code ────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Log in to Azure ──────────────────────────────────────────────────
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # ── 3. Build & push API image via ACR Tasks ─────────────────────────────
      # ACR builds happen in Azure (no Docker needed on the runner).
      # Kaggle creds are build-time args — not stored in the final image.
      # If data/chroma_db/ is committed, the Dockerfile skips re-ingestion.
      - name: Build and push API image
        run: |
          az acr build \
            --registry ${{ env.ACR_NAME }} \
            --image legal-cocounsel-api:${{ github.sha }} \
            --image legal-cocounsel-api:latest \
            --file Dockerfile \
            --build-arg KAGGLE_USERNAME=${{ secrets.KAGGLE_USERNAME }} \
            --build-arg KAGGLE_KEY=${{ secrets.KAGGLE_KEY }} \
            .

      # ── 4. Build & push Frontend image ──────────────────────────────────────
      - name: Build and push Frontend image
        run: |
          az acr build \
            --registry ${{ env.ACR_NAME }} \
            --image legal-cocounsel-frontend:${{ github.sha }} \
            --image legal-cocounsel-frontend:latest \
            --file Dockerfile.frontend \
            .

      # ── 5. Restart App Service to pull the new :latest image ─────────────────
      - name: Restart API App Service
        run: |
          az webapp restart \
            --name ${{ env.API_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }}

      - name: Restart Frontend App Service
        run: |
          az webapp restart \
            --name ${{ env.FRONTEND_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }}

      # ── 6. Print deployed URLs ────────────────────────────────────────────────
      - name: Print deployment URLs
        run: |
          API_URL=$(az webapp show \
            --name ${{ env.API_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query defaultHostName -o tsv)
          FRONTEND_URL=$(az webapp show \
            --name ${{ env.FRONTEND_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query defaultHostName -o tsv)
          echo "✅ API:      https://$API_URL"
          echo "✅ Frontend: https://$FRONTEND_URL"
